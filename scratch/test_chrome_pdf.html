<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page {
    size: A4;
    margin: 20mm 20mm 20mm 20mm;
  }
  body {
    font-family: Arial, sans-serif;
    font-size: 12pt;
    line-height: 1.5;
    color: #000;
    margin: 0;
    padding: 0;
  }
  .kop {
    text-align: left;
    border-bottom: 2px solid #000;
    padding-bottom: 5px;
    margin-bottom: 15px;
  }
  .kop p {
    margin: 0;
    font-weight: bold;
    font-size: 11pt;
    text-transform: uppercase;
  }
  .kop p.sub {
    font-weight: normal;
    font-size: 9pt;
    text-transform: none;
  }
  .title {
    text-align: center;
    margin: 20px 0;
  }
  .title h2 {
    font-size: 14pt;
    text-decoration: underline;
    margin: 0;
  }
  .title p {
    margin: 4px 0 0 0;
    font-size: 11pt;
  }
  p {
    text-align: justify;
    margin: 8px 0;
  }
</style>
</head>
<body>
  <div class="kop">
    <p>POLRI DAERAH JAWA TENGAH</p>
    <p>RESOR KOTA BESAR SEMARANG</p>
    <p>SEKTOR TEMBALANG</p>
    <p class="sub">Jl. Turus Asri no 9 Tembalang Semarang</p>
  </div>
  <div class="title">
    <h2>LAPORAN – INFORMASI</h2>
    <p>Nomor : R / LI / 01 / VIII / 2026 / Intelkam</p>
  </div>
  <p>I. SUMBER INFORMASI</p>
  <p>Orang yang dapat dipercaya dan mempunyai akses terhadap informasi.</p>
</body>
</html>
